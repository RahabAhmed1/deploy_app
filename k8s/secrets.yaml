# ⚠️  Do NOT commit real secrets to git.
# For local/minikube testing these placeholder values are fine.
# For production use: kubectl create secret generic or Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: pharmaflow-secrets
  namespace: pharmaflow
type: Opaque
stringData:
  mongodb-uri: "mongodb://mongodb-service:27017/pharmaflow_pro"
  jwt-secret: "change_this_to_a_strong_random_secret"
